# The tests that need nothing running (no model, no graphics card), on Windows and Linux.
# The tests that need a model are run by hand: see the README's Tests section.
name: tests
on:
  push:
  pull_request:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (Linux)
        if: runner.os != 'Windows'
        run: sh tests/run_offline.sh
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tests\run_offline.bat
